# Review every pull request with this repository's own review-pr skill.
#
# Because the workflow passes a `prompt`, the action runs in automation mode: it
# does not wait for an @claude mention. The checkout step is what makes the
# skill in .claude/skills/ available on the runner.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) installed on
# the repository, plus an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret.
# Run /install-github-app from Claude Code to do both at once. Until then the
# steps skip and the job passes, so a fresh copy of the template shows no red
# check on its first pull request.
#
# The gate is on the step, not the job, because the `secrets` and `env` contexts
# are not available when a job-level `if` is evaluated.
#
# On a public repository, GitHub withholds secrets from fork pull requests, so
# this runs only on branches in the same repository.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Report that Claude is not configured
        if: env.HAS_KEY != 'true'
        run: |
          echo "Skipped: no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret."
          echo "Run /install-github-app from Claude Code to set this up."

      - uses: actions/checkout@v6
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
